# Builds the single-file Linux binary for amd64 and arm64, each on a machine of that architecture,
# and attaches both to the release of the tag that was pushed (run by hand, it only builds).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: tpcloud
      - uses: actions/checkout@v4
        with:
          repository: mtaibo/tphome
          path: tphome
      - name: Build the runtime and the binary
        run: TPHOME_DIR="$GITHUB_WORKSPACE/tphome" tpcloud/cli/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tpcloud-linux-${{ matrix.arch }}
          path: tpcloud/cli/dist/tpcloud-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach the binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x dist/*
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "TPCloud ${GITHUB_REF_NAME#v}" \
                 --notes "Install on a Raspberry Pi or a Linux PC with \`curl -fsSL https://tpcloud.migueltaibo.com/install | sh\`, or download the file for that machine below and run \`sudo ./tpcloud-linux-<arch> install\`."
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
