# Builds the single-file Linux server and the Linux desktop app for amd64 and arm64, each on a
# machine of that architecture, and attaches them to the release of the tag that was pushed (run
# by hand, it only builds).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the job that publishes the release may write. Actions are pinned
# to the commit of the version used, so a moved tag can't change what runs here.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: tpcloud
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: mtaibo/tphome
          path: tphome
          persist-credentials: false
      - name: Build the runtime and the binary
        run: TPHOME_DIR="$GITHUB_WORKSPACE/tphome" tpcloud/cli/build.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: tpcloud-linux-${{ matrix.arch }}
          path: tpcloud/cli/dist/tpcloud-linux-${{ matrix.arch }}
          if-no-files-found: error

  desktop:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: tpcloud
          persist-credentials: false
      - name: Build the desktop app
        run: tpcloud/desktop/build.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: tpcloud-app-linux-${{ matrix.arch }}
          path: tpcloud/desktop/dist/tpcloud-app-linux-${{ matrix.arch }}
          if-no-files-found: error

  client-linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: tpcloud
          persist-credentials: false
      - name: Build the client tpcloud
        run: tpcloud/cli/build-client.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: tpcloud-cli-linux-${{ matrix.arch }}
          path: tpcloud/cli/dist/tpcloud-cli-linux-${{ matrix.arch }}
          if-no-files-found: error

  # The client tpcloud for Macs, Apple silicon and Intel in one file.
  client-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: tpcloud
          persist-credentials: false
      - name: Build the client tpcloud (universal)
        working-directory: tpcloud/cli
        run: |
          rustup toolchain install 1.88 --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo +1.88 build --release --locked --no-default-features --target "$target"
          done
          mkdir -p dist
          lipo -create -output dist/tpcloud-cli-macos target/aarch64-apple-darwin/release/tpcloud target/x86_64-apple-darwin/release/tpcloud
          lipo -info dist/tpcloud-cli-macos
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: tpcloud-cli-macos
          path: tpcloud/cli/dist/tpcloud-cli-macos
          if-no-files-found: error

  release:
    needs: [build, desktop, client-linux, client-macos]
    # GitHub's macOS runners are sometimes not handed out at all (three times on Nov 24 2026): the
    # release doesn't wait on the Mac client; without a new one it carries the previous one.
    if: startsWith(github.ref, 'refs/tags/') && !cancelled() && needs.build.result == 'success' && needs.desktop.result == 'success' && needs.client-linux.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: dist
          merge-multiple: true
      - name: Attach the binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -e dist/tpcloud-cli-macos ]; then
            prev="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 10 --json tagName --jq '.[].tagName' | grep -vx "$GITHUB_REF_NAME" | head -1)"
            echo "No new Mac client (its runner didn't come): carrying the one from $prev."
            gh release download "$prev" --repo "$GITHUB_REPOSITORY" --pattern tpcloud-cli-macos --dir dist
            MAC_NOTE=" (The Mac command is the one from ${prev#v}: GitHub's macOS runner wasn't available.)"
          fi
          chmod +x dist/*
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "TPCloud ${GITHUB_REF_NAME#v}" \
                 --notes "Install on a Raspberry Pi or a Linux PC with \`curl -fsSL https://tpcloud.migueltaibo.com/install | sh\`, or download the file for that machine below and run \`sudo ./tpcloud-linux-<arch> install\`. On a computer that uses it (Mac or Linux): \`curl -fsSL https://tpcloud.migueltaibo.com/get | sh\`.${MAC_NOTE:-}"
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
