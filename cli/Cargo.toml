[package]
name = "tpcloud"
version = "0.2.0"
edition = "2021"
description = "Installs, runs and configures a TPCloud server from one file."
license = "MIT"

[[bin]]
name = "tpcloud"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.98"
clap = { version = "=4.5.40", features = ["derive"] }
flate2 = "=1.1.2"
libc = "=0.2.174"
serde_json = "=1.0.140"
tar = "=0.4.44"
ureq = { version = "=2.12.1", default-features = false }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
