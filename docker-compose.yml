# Everything TPCloud runs, from one place: `docker compose up -d --build` here. tphome, if it's
# installed, has its own compose file in its own repo and joins the `tpcloud_gateway` network.
#
# The project name is fixed so the volumes, network and containers keep their names whatever this
# folder is called.
name: tpcloud

services:

  # ── Core ────────────────────────────────────────────────────────────────────────────────────

  gateway:
    image: caddy:2
    container_name: gateway
    environment:
      - TPCLOUD_SITE=${TPCLOUD_SITE:-:80}
      - TPCLOUD_TLS=${TPCLOUD_TLS:-none}
    ports:
      # Only what the chosen way in needs reaches beyond this machine; the defaults stay on
      # localhost (where `tailscale serve` picks the site up).
      - "${TPCLOUD_HTTP_PUBLISH:-127.0.0.1:8080}:80"
      - "${TPCLOUD_HTTPS_PUBLISH:-127.0.0.1:8443}:443"
      # tphome's switches fetch OTA firmware from http://<LAN IP>/firmware; published as 80 on the
      # LAN only where tphome is installed.
      - "${TPCLOUD_OTA_PUBLISH:-127.0.0.1:8081}:8081"
    volumes:
      - ./services/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./services/gateway/extra:/etc/caddy/extra:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - auth
    networks:
      - gateway
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  auth:
    build: ./services/auth
    container_name: tpcloud-auth
    env_file: .env
    volumes:
      - ./data/auth:/app/data
    networks:
      - gateway
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # The web apps build from web/ so the shared ui/ is in reach.
  login:
    build:
      context: ./web
      dockerfile: login/Dockerfile
    container_name: tpcloud-login
    depends_on:
      - auth
    networks:
      - gateway
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  cloud:
    build:
      context: ./web
      dockerfile: cloud/Dockerfile
    container_name: tpcloud-frontend
    depends_on:
      - auth
    networks:
      - gateway
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  accounts:
    build:
      context: ./web
      dockerfile: accounts/Dockerfile
    container_name: tpcloud-accounts
    depends_on:
      - auth
    networks:
      - gateway
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Only with COMPOSE_PROFILES=tunnel (your own domain through Cloudflare, no open ports).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - gateway
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # ── Store: files, photo backup, share links (COMPOSE_PROFILES=store) ───────────────────────────

  store-api:
    build: ./services/store
    container_name: tpstore-api
    profiles: ["store"]
    environment:
      - EXTERNAL_DISK_PATH=/mnt/external
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth:8000}
      - TPCLOUD_URL=${TPCLOUD_URL}
    volumes:
      - ${EXTERNAL_DISK_PATH:-/mnt/external}:/mnt/external
      # The host's disks, only for the admin backup (rsync of /mnt/storage to /mnt/backup). Off
      # unless TPSTORE_BACKUP_MOUNT=/mnt is set.
      - ${TPSTORE_BACKUP_MOUNT:-./data/store/no-backup}:/mnt/server/mnt
      - ./data/store:/app/data
    networks:
      - gateway
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  store-frontend:
    build: ./web/store
    container_name: tpstore-frontend
    profiles: ["store"]
    depends_on:
      - store-api
    networks:
      - gateway
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  share-frontend:
    build: ./web/share
    container_name: tpshare-frontend
    profiles: ["store"]
    networks:
      - gateway
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # The gallery, a section of its own at /photos; its data comes from store-api.
  photos-frontend:
    build: ./web/photos
    container_name: tpphotos-frontend
    profiles: ["store"]
    networks:
      - gateway
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # ── Home: tphome's control panel (COMPOSE_PROFILES=home) ─────────────────────────────────────
  # Its API, broker and firmware live in the tphome repo, next to this one; the gateway sends
  # /home/api there and /home here.

  home-frontend:
    build:
      context: ./web
      dockerfile: home/Dockerfile
    container_name: tphome-frontend
    profiles: ["home"]
    networks:
      - gateway
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  # Every module joins this one network to sit behind the gateway.
  gateway:
    name: tpcloud_gateway
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
