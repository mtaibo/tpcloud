services:

  gateway:
    image: caddy:2
    container_name: gateway
    environment:
      - TPCLOUD_SITE=${TPCLOUD_SITE:-:80}
      - TPCLOUD_TLS=${TPCLOUD_TLS:-none}
      - TPADMIN_UPSTREAM=${TPADMIN_UPSTREAM:-172.20.0.1:8100}
    ports:
      # Only what the chosen way in needs reaches beyond this machine; the defaults stay on
      # localhost (where `tailscale serve` picks the site up).
      - "${TPCLOUD_HTTP_PUBLISH:-127.0.0.1:8080}:80"
      - "${TPCLOUD_HTTPS_PUBLISH:-127.0.0.1:8443}:443"
      # tphome's switches fetch OTA firmware from http://<LAN IP>/firmware; published as 80 on the
      # LAN only where tphome is installed.
      - "${TPCLOUD_OTA_PUBLISH:-127.0.0.1:8081}:8081"
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./gateway/extra:/etc/caddy/extra:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - auth
    networks:
      - gateway
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  auth:
    build: ./auth
    container_name: tpcloud-auth
    env_file: .env
    volumes:
      - ./data:/app/data
    networks:
      - gateway
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  login:
    build:
      context: .
      dockerfile: login/Dockerfile
    container_name: tpcloud-login
    depends_on:
      - auth
    networks:
      - gateway
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  cloud:
    build:
      context: .
      dockerfile: cloud/Dockerfile
    container_name: tpcloud-frontend
    depends_on:
      - auth
    networks:
      - gateway
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  accounts:
    build:
      context: .
      dockerfile: accounts/Dockerfile
    container_name: tpcloud-accounts
    depends_on:
      - auth
    networks:
      - gateway
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Only with COMPOSE_PROFILES=tunnel (your own domain through Cloudflare, no open ports).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - gateway
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  # Every module joins this one network to sit behind the gateway.
  gateway:
    name: tpcloud_gateway
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
