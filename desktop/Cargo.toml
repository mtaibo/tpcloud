[package]
name = "tpcloud-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "TPCloud for the Linux desktop: your files, photos and home, native and fast."
license = "MIT"

[[bin]]
name = "tpcloud-app"
path = "src/main.rs"

[dependencies]
iced = { version = "=0.13.1", features = ["image", "tokio", "svg"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-webpki-roots-no-provider", "json", "multipart"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "=0.26.11"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
mdns-sd = { version = "=0.22.0", default-features = false }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "time", "fs", "process"] }
rfd = { version = "=0.15.4", default-features = false, features = ["xdg-portal", "tokio"] }
dirs = "=5.0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
