<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TPVal — Signing in…</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 40px;
      background: rgba(28, 28, 30, 0.97);
      border: 0.5px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      min-width: 280px;
      text-align: center;
    }
    .logo {
      width: 40px;
      height: 40px;
      background: #FF4655;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .title { font-size: 1rem; font-weight: 600; color: #fff; }
    .subtitle { font-size: 0.8rem; color: #636366; }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2.5px solid rgba(255,255,255,0.1);
      border-top-color: #FF4655;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { font-size: 0.8rem; color: #ff453a; }
    .success { font-size: 0.8rem; color: #30d158; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 32 32" width="22" height="22">
        <path d="M8 10 L16 22 L24 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </div>
    <p class="title" id="title">Signing in to Riot…</p>
    <div class="spinner" id="spinner"></div>
    <p class="subtitle" id="subtitle">Please wait</p>
  </div>

  <script>
    (async function () {
      const titleEl = document.getElementById('title')
      const spinnerEl = document.getElementById('spinner')
      const subtitleEl = document.getElementById('subtitle')

      function showError(msg) {
        spinnerEl.style.display = 'none'
        titleEl.textContent = 'Authentication failed'
        subtitleEl.innerHTML = '<span class="error">' + msg + '</span>'
        subtitleEl.style.color = '#ff453a'
      }

      function showSuccess() {
        spinnerEl.style.display = 'none'
        titleEl.textContent = 'Signed in!'
        subtitleEl.textContent = 'Closing…'
        subtitleEl.style.color = '#30d158'
      }

      // Parse URL fragment
      const hash = window.location.hash.slice(1)
      const params = new URLSearchParams(hash)

      // Also check query string (error cases come as query params from Riot)
      const query = new URLSearchParams(window.location.search)
      const error = params.get('error') || query.get('error')

      if (error) {
        showError('Riot rejected the login: ' + error)
        if (window.opener) {
          window.opener.postMessage({ type: 'riot-auth', success: false, error }, '*')
          setTimeout(() => window.close(), 2000)
        }
        return
      }

      const accessToken = params.get('access_token')
      if (!accessToken) {
        showError('No access token received.')
        if (window.opener) {
          window.opener.postMessage({ type: 'riot-auth', success: false, error: 'no_token' }, '*')
          setTimeout(() => window.close(), 2000)
        }
        return
      }

      try {
        const res = await fetch('/api/val/account/credentials/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ access_token: accessToken }),
        })

        if (!res.ok) {
          const data = await res.json().catch(() => ({}))
          showError(data.detail || 'Server error — try again')
          if (window.opener) {
            window.opener.postMessage({ type: 'riot-auth', success: false, error: data.detail || 'server_error' }, '*')
            setTimeout(() => window.close(), 2000)
          }
          return
        }

        showSuccess()
        if (window.opener) {
          window.opener.postMessage({ type: 'riot-auth', success: true }, '*')
          setTimeout(() => window.close(), 800)
        } else {
          setTimeout(() => { window.location.href = '/' }, 800)
        }
      } catch (e) {
        showError('Network error — check your connection')
        if (window.opener) {
          window.opener.postMessage({ type: 'riot-auth', success: false, error: 'network_error' }, '*')
          setTimeout(() => window.close(), 2000)
        }
      }
    })()
  </script>
</body>
</html>
