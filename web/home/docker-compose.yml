services:
  caddy:
    image: caddy:latest
    container_name: tphome-caddy
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - tphome-network
    restart: unless-stopped

  tphome-frontend:
    build: .
    container_name: tphome-frontend
    networks:
      - tphome-network
    restart: unless-stopped

networks:
  tphome-network:
    external: true

volumes:
  caddy_data:
  caddy_config: