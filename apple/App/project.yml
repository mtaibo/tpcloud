name: TPApp
options:
  bundleIdPrefix: com.migueltaibo
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"

packages:
  tpapp:
    path: ..

targets:
  TPApp-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.migueltaibo.tpapp
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_NAME: "$(TARGET_NAME)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: G3YVULBVD2
      configs:
        # App Store Connect needs the symbols to read crash reports.
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    dependencies:
      - package: tpapp
        product: TPCore
      - package: tpapp
        product: TPUI
      - package: tpapp
        product: TPCloudFeature
      - package: tpapp
        product: TPStoreFeature
      - package: tpapp
        product: TPHomeFeature
      - package: tpapp
        product: TPPhotosFeature
      - package: tpapp
        product: TPAdminFeature

  # Same bundle id as the iPhone's, so both are one app (universal purchase) in App Store Connect.
  TPApp-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.migueltaibo.tpapp
        # Without the iPhone's background modes, launch screen and orientations.
        INFOPLIST_FILE: Mac/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: "$(TARGET_NAME)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: G3YVULBVD2
        # The Mac App Store only takes sandboxed apps.
        CODE_SIGN_ENTITLEMENTS: Mac/TPCloud.entitlements
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    dependencies:
      - package: tpapp
        product: TPCore
      - package: tpapp
        product: TPUI
      - package: tpapp
        product: TPCloudFeature
      - package: tpapp
        product: TPStoreFeature
      - package: tpapp
        product: TPHomeFeature
      - package: tpapp
        product: TPPhotosFeature
      - package: tpapp
        product: TPAdminFeature

schemes:
  TPApp-iOS:
    build:
      targets:
        TPApp-iOS: all
    run:
      config: Debug
    test:
      config: Debug
  TPApp-macOS:
    build:
      targets:
        TPApp-macOS: all
    run:
      config: Debug
    test:
      config: Debug
